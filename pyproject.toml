[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "lidar_hd_tools"
version = "0.1.8"
authors = [
  { name="Thibault Chardon", email="pypi.flaxseed411@passinbox.com" },
]
description = "Python library for quick use of IGN's LiDAR-HD data."
readme = "ReadMe.md"
requires-python = ">=3.10"
dependencies = [
    "cartopy >=0.25.0",
	"cmcrameri >=1.9",
	"geopandas >=1.1.3",
	"laspy >=2.7.0",
	"matplotlib >=3.10.8",
	"numpy >=2.2.3",
	"owslib >=0.35.0",
	"pandas >= 3.0.2",
	"rasterio >=1.5.0",
	"requests >=2.32.5",
	"rioxarray >=0.21.0",
	"rvt-py >=2.2.3",
	"scipy >=1.18.0",
	"shapely >= 2.1.2",
	"tqdm >=4.67.3",
	"xarray >=2025.1.1",
]

classifiers = [
	"Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
license = "CC0-1.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Thibalt-C/lidar_hd_tools"